server:
  port: 8099

watchdog:
  interval-ms: 5000 #fréquence à laquelle le watchdog check
  timeout-ms: 1500 #temps max pour considérer un check comme “KO”
  retries: 3  #nombre de tentatives avant de déclarer DOWN
  instances:
    - name: core-one
      ip: 172.31.249.170
      sshUser: vm-operations-core
      sshPort: 22
    - name: core-two
      ip: 172.31.252.225
      sshUser: vm-operational-core-2
      sshPort: 22

management:
  endpoints:
    web:
      exposure:
        include: health,info